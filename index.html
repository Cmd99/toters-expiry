<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="اكسباير توترز">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="512x512" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <title>اكسباير توترز</title>
    <script src="https://unpkg.com/html5-qrcode" defer></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --input: #0b1120;
            --border: #334155;
            --text: #f8fafc;
            --muted: #94a3b8;
            --primary: #10b981;
            --primary-dark: #059669;
            --blue: #2563eb;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body {
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 14px;
            line-height: 1.5;
        }
        .container { max-width: 720px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 18px; }
        header h1 { color: var(--primary); font-size: 1.4rem; margin: 0 0 4px; }
        header p { color: var(--muted); font-size: 0.82rem; margin: 0; }

        .alert-banner {
            background: rgba(239, 68, 68, 0.18);
            border: 1px solid var(--danger);
            color: #fca5a5;
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .hidden { display: none !important; }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 18px;
        }
        .card h2 {
            color: #6ee7b7;
            font-size: 1.02rem;
            margin: 0 0 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 0.84rem; color: #cbd5e1; margin-bottom: 6px; }
        input[type="text"], input[type="date"] {
            width: 100%;
            background: var(--input);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 11px 12px;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
        }
        input:focus { border-color: var(--primary); }

        .barcode-row { display: flex; gap: 8px; }
        .barcode-row input { flex: 1; font-family: monospace; font-size: 1.05rem; letter-spacing: 0.5px; }

        .btn {
            border: none;
            border-radius: 10px;
            padding: 11px 14px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: 0.15s;
        }
        .btn:active { transform: scale(0.97); }
        .btn-blue { background: var(--blue); white-space: nowrap; }
        .btn-primary { background: var(--primary-dark); width: 100%; padding: 13px; font-size: 1rem; }
        .btn-sm { padding: 6px 10px; font-size: 0.78rem; border-radius: 8px; }
        .btn-danger { background: rgba(239, 68, 68, 0.85); }
        .btn-alarm { background: #d97706; }
        .btn-slate { background: #334155; }
        .btn-whatsapp { background: #16a34a; width: 100%; margin-bottom: 10px; }

        .scanner-box {
            margin-top: 10px;
            background: #000;
            border: 2px solid var(--blue);
            border-radius: 14px;
            overflow: hidden;
            position: relative;
        }
        #scannerVideo {
            width: 100%;
            max-height: 240px;
            object-fit: cover;
            display: block;
        }
        .scan-line {
            position: absolute;
            top: 50%;
            left: 10%;
            right: 10%;
            height: 2px;
            background: #ef4444;
            box-shadow: 0 0 8px #ef4444;
            pointer-events: none;
        }
        .scanner-controls {
            display: flex;
            gap: 8px;
            padding: 10px;
            background: #0b1120;
            justify-content: center;
        }

        .status-msg { font-size: 0.8rem; margin-top: 6px; display: block; }
        .text-ok { color: #34d399; }
        .text-err { color: #f87171; }
        .text-wait { color: #fbbf24; }

        .preview-box {
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .preview-box img {
            width: 54px;
            height: 54px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .team-tools {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .item-card {
            background: var(--input);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        .item-thumb {
            width: 66px;
            height: 66px;
            border-radius: 10px;
            object-fit: cover;
            background: #1e293b;
            border: 1px solid var(--border);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            font-size: 1.5rem;
        }
        .item-info { flex: 1; min-width: 0; }
        .item-title { font-weight: 700; font-size: 0.98rem; margin: 0 0 4px; word-break: break-word; }
        .item-meta { font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.76rem;
            font-weight: 700;
            border: 1px solid transparent;
        }
        .b-expired { background: rgba(127, 29, 29, 0.6); color: #fca5a5; border-color: #ef4444; }
        .b-2d { background: rgba(239, 68, 68, 0.25); color: #f87171; border-color: #ef4444; }
        .b-7d { background: rgba(249, 115, 22, 0.25); color: #fb923c; border-color: #f97316; }
        .b-15d { background: rgba(245, 158, 11, 0.25); color: #fbbf24; border-color: #f59e0b; }
        .b-30d { background: rgba(234, 179, 8, 0.2); color: #fde047; border-color: #eab308; }
        .b-60d { background: rgba(59, 130, 246, 0.2); color: #93c5fd; border-color: #3b82f6; }
        .b-90d { background: rgba(99, 102, 241, 0.2); color: #a5b4fc; border-color: #6366f1; }
        .b-safe { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border-color: #10b981; }

        .item-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        .dev-footer {
            margin-top: 22px;
            padding: 14px 8px 8px;
            border-top: 1px solid rgba(51, 65, 85, 0.55);
            text-align: center;
            font-size: 0.72rem;
            letter-spacing: 1.4px;
            color: #64748b;
            user-select: none;
        }
        .dev-footer .code-tag {
            color: var(--primary);
            font-family: monospace;
            font-weight: 700;
